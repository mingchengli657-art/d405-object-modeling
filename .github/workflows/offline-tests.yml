name: Offline modeling tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install package and test dependencies
        run: python -m pip install '.[test]'
      - name: Test installed package
        run: python -m pytest tests -v
      - name: Build real RGB-D example
        run: object-modeling build --dataset examples/object_003_subset --config configs/d405_charuco.yaml --output outputs/example

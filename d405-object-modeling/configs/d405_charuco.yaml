camera:
  color_topic: /camera/d405/color/image_raw
  depth_topic: /camera/d405/aligned_depth_to_color/image_raw
  camera_info_topic: /camera/d405/color/camera_info
  depth_scale: 0.001

charuco:
  dictionary: DICT_5X5_100
  squares_x: 12
  squares_y: 9
  square_length_m: 0.015
  marker_length_m: 0.01125

capture:
  # The object and board stay fixed while the D405 is moved by hand.
  interval_ms: 230
  min_charuco_corners: 12
  sync_slop_ms: 50
  max_reprojection_error_px: 3.0
  min_corner_area_ratio: 0.015
  min_sharpness: 20.0
  min_depth_valid_ratio: 0.20
  azimuth_bins: 24
  elevation_edges_deg: [0, 25, 45, 65, 90]
  max_per_view_bin: 4

model:
  voxel_size_m: 0.002
  pixel_stride: 2
  board_z_min_m: 0.008
  board_z_max_m: 0.60
  board_xy_margin_m: 0.025
  min_voxel_views: 2
  support_voxel_size_m: 0.006
  board_plane_clearance_m: 0.012
  component_seed_z_m: 0.020
  component_eps_m: 0.004
  base_xy_margin_m: 0.004
  statistical_outlier_filter: true
  sor_k: 12
  sor_std_ratio: 2.5
